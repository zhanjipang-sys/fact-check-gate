# 证据卡模板（按核查环节设计草案 §四）——每条 claim 一张，可填写。
# 机器校验推荐把卡集另存为 claims.json（结构与此一致）；本 YAML 为人工填写模板。
generator: ""        # 生成者（模型/工人名），必填
l2_reviewer: ""      # L2 异源复核者，必须 != generator，必填
claims:
  - claim_id: C01
    旁白句号: S01            # 脚本中的句子编号，旁白以 [S01 -> C01] 回指
    断言原文: ""
    断言类型: 事件           # 事件 / 数字 / 引语 / 人物言论 / 图片说明
    出处:                    # 至少两条且相互独立，至少一条一手；同源转载只计一条
      - 链接: ""             # 逐字 URL，不许重构
        出处等级: 一手       # 一手 / 二手 / 自媒体 / 已判库(ClaimReview)
        发布方: ""
        发布时间: ""         # ISO 时间，与事件时间分开记
        事件时间: ""
        原文摘录: ""         # ≤50 字短摘
      - 链接: ""
        出处等级: 二手
        发布方: ""
        发布时间: ""
        事件时间: ""
        原文摘录: ""
    核查结论: 证实           # 证实 / 存疑 / 证伪 / 查无（脚本字段名 verdict，二选一即可）
    verdict: 证实
    数字对账: 不涉及         # 已对账 / 不涉及 / 对不上（附对账表行号）
    图片卡: 不涉及           # 不涉及 / IMG-01
    l3_decision: ""          # 存疑卡必填：L3 拍板记录（谁、何时、结论），无此字段门禁不放行
    核查者: ""               # L0 脚本 / L1 工人名 / L2 异源模型名 / L3 用户
    核查时间: ""             # 如 2026-11-25 15:40 CST
    备注: ""                 # 冲突点、表述落差、降级处理、发布后更正记录追加于此

